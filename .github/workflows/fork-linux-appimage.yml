name: fork-linux-appimage

# Unofficial Linux Type 2 AppImages for this fork (x64 + aarch64).
# GitHub only runs `schedule` from the default branch, so this file must
# stay on 3ddruck12/cline main. Every 12 hours it looks at cline/cline
# for a new stable desktop-vX.Y.Z tag and rebuilds if this fork does not
# already have linux-appimage-vX.Y.Z.
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this version was already released"
        type: boolean
        default: false

concurrency:
  group: fork-linux-appimage-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  decide:
    name: Detect new upstream desktop version
    if: github.repository == '3ddruck12/cline'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve latest stable desktop tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          TAG=$(gh api --paginate repos/cline/cline/git/matching-refs/tags/desktop-v \
            --jq '.[].ref' \
            | sed 's|^refs/tags/||' \
            | grep -E '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)
          if [ -z "$TAG" ]; then
            echo "no stable desktop-vX.Y.Z tag found on cline/cline"
            exit 1
          fi
          VERSION="${TAG#desktop-v}"
          echo "Latest official desktop tag: ${TAG}"

          SHOULD_BUILD=true
          if [ "$FORCE" != "true" ] && gh release view "linux-appimage-v${VERSION}" >/dev/null 2>&1; then
            echo "Fork already has linux-appimage-v${VERSION}; skipping."
            SHOULD_BUILD=false
          fi

          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Linux ${{ matrix.arch }} AppImage
    needs: decide
    if: github.repository == '3ddruck12/cline' && needs.decide.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            appimagetool: appimagetool-x86_64.AppImage
            runtime: runtime-x86_64
            tool_arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            appimagetool: appimagetool-aarch64.AppImage
            runtime: runtime-aarch64
            tool_arch: aarch64
    env:
      NO_STRIP: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Checkout official desktop tag
        uses: actions/checkout@v4
        with:
          repository: cline/cline
          ref: ${{ needs.decide.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/examples/desktop-app/src-tauri -> target

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            upx-ucl \
            wget

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDK packages
        run: bun run build:sdk

      - name: Ignore ldd on Bun sidecar binaries
        run: |
          sudo mv /usr/bin/ldd /usr/bin/ldd.real
          sudo tee /usr/bin/ldd >/dev/null <<'EOF'
          #!/bin/bash
          for arg in "$@"; do
            [ -f "$arg" ] || continue
            case "$(basename -- "$arg")" in
              code-sidecar|code-sidecar-*|cline-remote-helper-*)
                printf '\tnot a dynamic executable\n'
                exit 0
                ;;
            esac
          done
          exec /usr/bin/ldd.real "$@"
          EOF
          sudo chmod 755 /usr/bin/ldd

      - name: Build AppImage
        working-directory: apps/examples/desktop-app
        run: bunx tauri build --bundles appimage --verbose

      - name: Repack as AppImage Type 2
        working-directory: apps/examples/desktop-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          VERSION: ${{ needs.decide.outputs.version }}
          TOOL_ARCH: ${{ matrix.tool_arch }}
          APPIMAGETOOL: ${{ matrix.appimagetool }}
          RUNTIME: ${{ matrix.runtime }}
          ARCH_SUFFIX: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/release/bundle/appimage"
          APPDIR=$(find "$BUNDLE_DIR" -maxdepth 1 -type d -name '*.AppDir' -print -quit)
          if [ -z "$APPDIR" ]; then
            echo "no AppDir produced under $BUNDLE_DIR"
            find "$BUNDLE_DIR" -maxdepth 2 | head -50
            exit 1
          fi

          TOOLS="$RUNNER_TEMP/appimage-type2"
          mkdir -p "$TOOLS"
          curl -fsSL -o "$TOOLS/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/${APPIMAGETOOL}"
          curl -fsSL -o "$TOOLS/runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/${RUNTIME}"
          chmod +x "$TOOLS/appimagetool"

          OUT="dist/publish"
          mkdir -p "$OUT"
          NAME="Cline_${VERSION}_${ARCH_SUFFIX}.AppImage"
          DEST="$OUT/$NAME"

          ARCH="$TOOL_ARCH" "$TOOLS/appimagetool" \
            --no-appstream \
            --runtime-file "$TOOLS/runtime" \
            "$APPDIR" \
            "$DEST"
          chmod +x "$DEST"

          MAGIC=$(od -An -tx1 -N 3 -j 8 "$DEST" | tr -d ' \n')
          echo "AppImage magic at offset 8: $MAGIC"
          if [ "$MAGIC" != "414902" ]; then
            echo "expected Type 2 magic 41 49 02, got $MAGIC"
            exit 1
          fi

          ls -lh "$DEST"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ matrix.arch }}
          retention-days: 30
          path: apps/examples/desktop-app/dist/publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - decide
      - build
    if: github.repository == '3ddruck12/cline' && needs.decide.outputs.should_build == 'true' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          path: dist/desktop
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(dist/desktop/*.AppImage)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no AppImage artifacts downloaded"
            ls -la dist/desktop || true
            exit 1
          fi
          RELEASE="linux-appimage-v${VERSION}"
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          NOTES=$(cat <<EOF
          Unofficial Linux Type 2 AppImages (static type2-runtime, no libfuse2).

          Built from official tag [\`${TAG}\`](https://github.com/cline/cline/releases/tag/${TAG}).
          This is **not** an official Cline release.

          | File | Arch |
          | --- | --- |
          | \`Cline_${VERSION}_amd64.AppImage\` | x86_64 |
          | \`Cline_${VERSION}_aarch64.AppImage\` | ARM64 |

          \`\`\`bash
          chmod +x Cline_${VERSION}_amd64.AppImage
          ./Cline_${VERSION}_amd64.AppImage
          \`\`\`
          EOF
          )
          gh release create "$RELEASE" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cline Desktop Linux AppImage v${VERSION}" \
            --notes "$NOTES"
          ls -lh "${FILES[@]}"
